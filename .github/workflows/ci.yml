name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit Tests (Calculations)
        run: npm run test:calculations

      # Build before the test suite: release-manifest.test.ts reads the built
      # routing table (.next/routes-manifest.json) to prove the archive route
      # is reachable.
      - name: Build (Webpack)
        run: npm run build:webpack

      - name: Test suite (all __tests__ files)
        run: npm run test

      - name: Validation Suite
        run: npm run validate
